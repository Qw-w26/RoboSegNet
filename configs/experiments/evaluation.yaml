# Multi-task Boundary DETR Configuration
# Tuned hyperparameters from November 2024 tuning (val_f1=0.2834)

experiment_name: multi_task_detr

model:
  # Architecture type
  architecture: "boundary_detr"

  # Basic settings
  vocab_size: 2048
  token_embed_dim: 600
  num_dino_frames: 9
  prediction_window_size: 18

  # Feature modalities
  use_proprio: true
  use_dino: true

  # Visual encoder settings
  visual_hidden_dim: 256
  visual_dropout: 0.139

  # Cross-modal attention settings
  cross_modal_dim: 512
  attention_dropout: 0.090
  num_attention_heads: 8

  # DETR-specific settings
  d_model: 512
  num_encoder_layers: 6
  num_decoder_layers: 6
  num_boundary_queries: 9
  detr_dropout: 0.298
  detr_feedforward_dim: 2048

  # Legacy settings (for TinyFASTEncoder)
  transformer_dropout: 0.190711
  embedding_dropout: 0.18593

data:
  # Multi-task configuration
  meta_dir: /shared/projects/agibot/full_dataset/
  # train_task_ids: [327, 352, 354, 356, 357, 358, 359, 360, 365, 366, 367, 368, 372, 374, 375, 376, 377, 378, 380, 384, 385, 389, 390]
  # eval_task_ids: [327, 352, 354, 356, 357, 358, 359, 360, 365, 366, 367, 368, 372, 374, 375, 376, 377, 378, 380, 384, 385, 389, 390]
  train_task_ids: [374, 398, 327, 385, 389, 376, 375, 357, 358, 356, 354, 360, 372, 359, 378, 390, 377, 384]
  eval_task_ids: [374, 398, 327, 385, 389, 376, 375, 357, 358, 356, 354, 360, 372, 359, 378, 390, 377, 384]
  # 440 is broken
  # train_task_ids: [327]
  # eval_task_ids: [327]
  cache_dir: ./cache

  # - 374: 91
  # - 440: 165
  # - 398: 173
  # - 327: 209
  # - 385: 214
  # - 389: 312
  # - 376: 403
  # - 375: 422
  # - 357: 428
  # - 358: 470
  # - 356: 475
  # - 354: 516
  # - 360: 517
  # - 372: 537
  # - 359: 644
  # - 378: 739
  # - 390: 750
  # - 377: 794
  # - 384: 808
  # - 380: 815
  # - 424: 916
  # - 392: 977


  # Dataset parameters
  window_size: 18
  stride: 1
  fps: 2.0
  action_dim: 14
  num_dino_frames: 9

  # DataLoader (optimized batch size with gradient accumulation)
  batch_size: 1024
  num_workers: 16
  pin_memory: true

  # Feature extraction
  vocab_size: 2048

  # DETR-specific: Set-based targets (no label smoothing)
  target_format: "set_based"  # Use set-based targets instead of dense labels

  # Processing
  ray_num_workers: 4
  max_samples: null

training:
  num_epochs: 2000  # DETR typically needs more epochs

  # Learning rate
  learning_rate: 0.000415
  weight_decay: 0.000497
  optimizer: adamw

  # Warmup
  warmup_steps: 1000
  warmup_start_lr: 0.0000001

  # Scheduler
  scheduler: cosine
  min_lr: 0.000001  # 1e-6

  # DETR Loss settings
  loss_type: "set_criterion"
  loss_position_weight: 5.12
  loss_confidence_weight: 2.06
  loss_eos_coef: 0.093

  # Optional: Use focal loss for confidence (helps with class imbalance)
  use_focal_loss: false
  loss_focal_alpha: 0.25  # Only used if use_focal_loss=true
  loss_focal_gamma: 2.0

  # Hungarian matcher costs
  matcher_cost_position: 9.45
  matcher_cost_confidence: 2.70

  # Metrics (for evaluation)
  confidence_threshold: 0.5  # Threshold for filtering predictions
  # boundary_tolerance: 2.0  # Tolerance in frames for matching (±2 frames)
  metric_tolerances: [1.0, 2.0, 3.0]
  # mAP computation settings
  confidence_thresholds_for_map: [0.3, 0.4, 0.5]

  # Regularization
  gradient_clip_val: 0.230
  gradient_clip_type: "norm"
  gradient_accumulation_steps: 4
  use_amp: true

  # Checkpointing
  checkpoint_dir: ./checkpoints/multi_task_detr
  save_every: 10
  save_best_only: true
  monitor_metric: "val/f1"  # Monitor F1 score

  # Early stopping
  early_stopping: true
  patience: 10 

  # Logging
  log_every: 10
  log_plots_every: 5
  num_plots: 3

  # System
  device: auto
  seed: 42

wandb:
  enabled: true
  project: task-segmentation
  name: multi_task_detr
  tags: [multi_task, detr, tuned]
  notes: "Multi-task DETR with tuned hyperparameters"
  mode: online
  log_model: true
