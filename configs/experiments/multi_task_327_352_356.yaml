# Multi-task experiment: Train on tasks 327, 352, 356
# This demonstrates training on multiple tasks simultaneously

experiment_name: multi_task_327_352_356

model:
  vocab_size: 2048
  token_embed_dim: 192
  num_dino_frames: 6
  hidden_dims: [1024, 512, 256]
  prediction_window_size: 18
  use_proprio: true
  use_dino: true
  transformer_dropout: 0.33
  embedding_dropout: 0.24
  dino_encoder_dropout: 0.15
  mlp_dropout: 0.24
  feature_noise_std: 0.03

data:
  # Multi-task configuration
  meta_dir: /shared/projects/agibot/full_dataset/
  train_task_ids: [327, 352, 354, 356, 357, 358, 359, 360, 365, 366, 367, 368, 372, 374, 375, 376, 377, 378, 380, 384, 385, 389, 390]
  eval_task_ids: [327, 352, 354, 356, 357, 358, 359, 360, 365, 366, 367, 368, 372, 374, 375, 376, 377, 378, 380, 384, 385, 389, 390]
  cache_dir: ./cache

  # Dataset parameters
  window_size: 18
  stride: 1
  fps: 2.0
  action_dim: 14

  # DataLoader
  batch_size: 2048
  num_workers: 16  # Reduced from 64 - too many workers causes overhead
  pin_memory: true

  # Feature extraction
  vocab_size: 2048
  label_smoother_type: gaussian
  label_smoother_sigma: 1.0
  label_smoother_peak_value: 1.0

  # Processing
  ray_num_workers: 4
  max_samples: null

training:
  num_epochs: 5000
  learning_rate: 0.0002
  weight_decay: 0.000001
  optimizer: adam

  # Scheduler
  scheduler: cosine
  min_lr: 0.000001

  # Loss
  loss_type: mse
  loss_pos_weight: 10.0
  loss_alpha: 0.223
  loss_gamma: 2.551

  # Metrics
  classification_threshold: 0.40
  peak_detection_distance: 2.0
  iou_window_size: 2.0
  metric_tolerances: [1.0, 3.0, 5.0]

  # Regularization
  gradient_clip_val: null
  use_amp: false

  # Checkpointing
  checkpoint_dir: ./checkpoints/multi_task_327_352_356
  save_every: 10
  save_best_only: true

  # Early stopping
  early_stopping: false
  patience: 10

  # Logging
  log_every: 10
  log_plots_every: 3
  num_plots: 3

  # System
  device: auto
  seed: 42

wandb:
  enabled: true
  project: task-segmentation
  name: multi_task_327_352_356
  tags: [multi_task, task_327, task_352, task_356]
  notes: "Multi-task training on tasks 327, 352, and 356"
  mode: online
  log_model: true
