# Cross-task evaluation example: Train on 327, 352, 356 and evaluate on 357
# This tests generalization to unseen tasks

experiment_name: train_327_352_356_eval_357

model:
  vocab_size: 2048
  token_embed_dim: 192
  num_dino_frames: 6
  hidden_dims: [1024, 512, 256]
  prediction_window_size: 18
  use_proprio: true
  use_dino: true
  transformer_dropout: 0.3
  embedding_dropout: 0.1
  dino_encoder_dropout: 0.4
  mlp_dropout: 0.4
  feature_noise_std: 0.05

data:
  # Cross-task evaluation configuration
  meta_dir: ./full_dataset
  train_task_ids: [327, 352, 356]  # Train on these tasks
  eval_task_ids: [357]  # Evaluate on different task (test generalization)

  cache_dir: ./cache

  # Dataset parameters
  window_size: 18
  stride: 1
  fps: 2.0
  action_dim: 14

  # DataLoader
  batch_size: 2048
  num_workers: 4
  pin_memory: true

  # Feature extraction
  vocab_size: 2048
  label_smoother_type: gaussian
  label_smoother_sigma: 1.0
  label_smoother_peak_value: 1.0

  # Processing
  ray_num_workers: 4
  max_samples: null

training:
  num_epochs: 1000
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adam

  # Scheduler
  scheduler: cosine
  min_lr: 0.000001

  # Loss
  loss_type: mse
  loss_pos_weight: 10.0
  loss_alpha: 0.25
  loss_gamma: 2.0

  # Metrics
  classification_threshold: 0.45
  peak_detection_distance: 2.0
  iou_window_size: 0.5
  metric_tolerances: [1.0, 2.0, 3.0]

  # Regularization
  gradient_clip_val: null
  use_amp: false

  # Checkpointing
  checkpoint_dir: ./checkpoints/train_327_352_356_eval_357
  save_every: 10
  save_best_only: true

  # Early stopping
  early_stopping: false
  patience: 10

  # Logging
  log_every: 10
  log_plots_every: 3
  num_plots: 3

  # System
  device: auto
  seed: 42

wandb:
  enabled: true
  project: task-segmentation
  name: train_327_352_356_eval_357
  tags: [cross_task_eval, train_327_352_356, eval_357]
  notes: "Cross-task evaluation: train on 327,352,356 and evaluate on 357"
  mode: online
  log_model: true
