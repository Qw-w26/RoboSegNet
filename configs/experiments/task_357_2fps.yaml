# Experiment configuration for Task 357: Wash dishes with dishwasher
# This config trains a boundary prediction model on task 357 data

experiment_name: task_357_baseline

model:
  vocab_size: 2048
  token_embed_dim: 192
  num_dino_frames: 6  # Number of DINO frames to sample per window (evenly spaced)
  # dino_feature_dim: Auto-calculated as num_dino_frames * 1024 = 3072
  hidden_dims: [1024, 512, 256]
  prediction_window_size: 18  # Updated to match window_size
  use_proprio: true
  use_dino: true
  transformer_dropout: 0.3
  embedding_dropout: 0.1
  dino_encoder_dropout: 0.4
  mlp_dropout: 0.4
  feature_noise_std: 0.05

data:
  splits_dir: ./data_task_357_2fps
  cache_dir: ./cache

  # Dataset parameters
  # Note: window_size and stride are at window_fps (DINO frequency)
  # Proprio is extracted at full 30 Hz within each window (auto-detected)
  window_size: 18  # Frames at window_fps (2 Hz) - reduced from 90 to fit 70 DINO samples
  stride: 1        # Frames at window_fps (2 Hz)
  fps: 2.0         # Window FPS (matches DINO extraction rate)
  action_dim: 14

  # DataLoader
  batch_size: 1024
  num_workers: 4
  pin_memory: true

  # Feature extraction
  vocab_size: 2048
  label_smoother_type: gaussian
  label_smoother_sigma: 1.0
  label_smoother_peak_value: 1.0

  # Processing
  ray_num_workers: 4
  max_samples: null

training:
  num_epochs: 1000
  learning_rate: 0.00005
  weight_decay: 0.0001
  optimizer: adam

  # Scheduler
  scheduler: cosine
  min_lr: 0.000001

  # Loss function: dist_ce | kl_div | js_div | focal_dist_ce | bce | weighted_bce | soft_focal | focal_bce | mse | mse_raw
  # RECOMMENDED: dist_ce (Distribution Cross-Entropy) - treats window as probability distribution
  # LEGACY: bce (Binary Cross-Entropy) - treats each frame independently (not ideal for this task)
  loss_type: mse

  # Loss hyperparameters (only applicable to certain loss types)
  loss_pos_weight: 10.0  # For: bce, weighted_bce
  loss_alpha: 0.25       # For: soft_focal, focal_bce, focal_dist_ce
  loss_gamma: 2.0        # For: soft_focal, focal_bce, focal_dist_ce

  # Metrics
  classification_threshold: 0.45  # Threshold for binary classification (probability > threshold = boundary)

  # Evaluation parameters (in seconds, will be scaled to frames at proprio_fps)
  peak_detection_distance: 2.0  # Minimum time (seconds) between detected peaks
  iou_window_size: 0.5          # Window size (seconds) around each transition for IoU calculation
  metric_tolerances: [1.0, 2.0, 3.0]  # Tolerances (in seconds) for computing metrics at different thresholds

  # Regularization
  gradient_clip_val: null
  use_amp: false

  # Checkpointing
  checkpoint_dir: ./checkpoints/task_357_2fps
  save_every: 10
  save_best_only: true

  # Early stopping
  early_stopping: false
  patience: 10

  # Logging
  log_every: 10
  log_plots_every: 3
  num_plots: 3

  # System
  device: auto
  seed: 42

wandb:
  enabled: true
  project: task-segmentation
  name: task_357_baseline
  tags: [task_357, baseline]
  notes: "Baseline training for task 357 (wash dishes)"
  mode: online
  log_model: true
