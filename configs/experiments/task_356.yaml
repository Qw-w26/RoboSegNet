# Experiment configuration for Task 357: Wash dishes with dishwasher
# This config trains a boundary prediction model on task 357 data

experiment_name: task_356_baseline

model:
  vocab_size: 2048
  token_embed_dim: 128
  dino_feature_dim: 3072
  hidden_dims: [512, 256, 128]
  prediction_window_size: 180
  use_proprio: true
  use_dino: true
  transformer_dropout: 0.3
  embedding_dropout: 0.1
  dino_encoder_dropout: 0.3
  mlp_dropout: 0.3
  feature_noise_std: 0.05

data:
  splits_dir: ./splits
  cache_dir: ./cache

  # Dataset parameters
  window_size: 180
  stride: 10
  fps: 5.0
  action_dim: 14

  # DataLoader
  batch_size: 512
  num_workers: 4
  pin_memory: true

  # Feature extraction
  vocab_size: 2048
  label_smoother_type: gaussian
  label_smoother_sigma: 5.0
  label_smoother_peak_value: 1.0

  # Processing
  ray_num_workers: 4
  max_samples: null

training:
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam

  # Scheduler
  scheduler: cosine
  min_lr: 0.000001

  # Loss function: dist_ce | kl_div | js_div | focal_dist_ce | bce | weighted_bce | soft_focal | focal_bce | mse
  # RECOMMENDED: dist_ce (Distribution Cross-Entropy) - treats window as probability distribution
  # LEGACY: bce (Binary Cross-Entropy) - treats each frame independently (not ideal for this task)
  loss_type: dist_ce

  # Loss hyperparameters (only applicable to certain loss types)
  loss_pos_weight: 10.0  # For: bce, weighted_bce
  loss_alpha: 0.25       # For: soft_focal, focal_bce, focal_dist_ce
  loss_gamma: 2.0        # For: soft_focal, focal_bce, focal_dist_ce

  # Metrics
  classification_threshold: 0.3  # Threshold for binary classification (probability > threshold = boundary)

  # Regularization
  gradient_clip_val: null
  use_amp: false

  # Checkpointing
  checkpoint_dir: ./splits
  save_every: 10
  save_best_only: true

  # Early stopping
  early_stopping: false
  patience: 10

  # Logging
  log_every: 10
  log_plots_every: 3
  num_plots: 3

  # System
  device: auto
  seed: 42

wandb:
  enabled: true
  project: task-segmentation
  name: task_357_baseline
  tags: [task_357, baseline]
  notes: "Baseline training for task 357 (wash dishes)"
  mode: online
  log_model: true
